<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Fern 2 | Developer Portal</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Load Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .doc-iframe { background-color: white; }
    </style>
</head>
<body class="bg-[#0f172a]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icon Component to handle Lucide in React UMD
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [activeDoc, setActiveDoc] = useState(null);

            const docs = [
                {
                    id: 'gdd',
                    title: 'Game Design Document',
                    description: 'The master blueprint for Finding Fern 2. Covers mechanics, story, and world-building.',
                    icon: 'book-open',
                    file: 'FF2GDD.html',
                    color: 'from-violet-500 to-purple-600',
                    tags: ['Design', 'Core', 'V2.5']
                },
                {
                    id: 'add',
                    title: 'Audio Design Document',
                    description: 'Technical sound specifications, character voice-over manifests, and atmospheric soundscapes.',
                    icon: 'volume-2',
                    file: 'FF2ADD.html',
                    color: 'from-blue-500 to-cyan-600',
                    tags: ['Audio', 'Technical', 'Asset List']
                },
                {
                    id: 'asg',
                    title: 'Art Style Guide',
                    description: 'Visual identity, color palettes, and stylistic constraints for environmental and character art.',
                    icon: 'palette',
                    file: 'FF2ASG2.html',
                    color: 'from-emerald-500 to-teal-600',
                    tags: ['Art', 'Visuals', 'UI/UX']
                }
            ];

            const handleOpenDoc = (doc) => {
                setActiveDoc(doc);
                window.scrollTo(0, 0);
            };

            const closeDoc = () => {
                setActiveDoc(null);
            };

            return (
                <div className="min-h-screen text-slate-200 selection:bg-violet-500/30">
                    {/* Background Decoration */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-violet-600/10 blur-[120px] rounded-full"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 blur-[120px] rounded-full"></div>
                    </div>

                    {!activeDoc ? (
                        /* Main Landing Dashboard */
                        <div className="relative z-10 max-w-6xl mx-auto px-6 py-12 lg:py-24">
                            <header className="mb-16 text-center lg:text-left">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-400 text-xs font-bold uppercase tracking-widest mb-6">
                                    <div className="w-2 h-2 rounded-full bg-violet-500 animate-pulse"></div>
                                    Development Portal
                                </div>
                                <h1 className="text-5xl lg:text-7xl font-black tracking-tight text-white mb-6">
                                    Finding <span className="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-blue-400">Fern 2</span>
                                </h1>
                                <p className="text-lg text-slate-400 max-w-2xl leading-relaxed">
                                    Welcome to the official internal repository. This site hosts the most current 
                                    specifications for the project's design, audio architecture, and visual identity.
                                </p>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {docs.map((doc) => (
                                    <button
                                        key={doc.id}
                                        onClick={() => handleOpenDoc(doc)}
                                        className="group relative flex flex-col text-left p-8 rounded-2xl bg-slate-800/40 border border-slate-700/50 hover:border-violet-500/50 transition-all duration-300 hover:translate-y-[-4px] overflow-hidden"
                                    >
                                        <div className="absolute inset-0 bg-gradient-to-br from-violet-600/0 to-violet-600/0 group-hover:from-violet-600/5 group-hover:to-blue-600/5 transition-all duration-300"></div>
                                        
                                        <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${doc.color} flex items-center justify-center text-white mb-6 shadow-lg shadow-violet-900/20`}>
                                            <Icon name={doc.icon} className="w-6 h-6" />
                                        </div>
                                        
                                        <div className="flex gap-2 mb-4">
                                            {doc.tags.map(tag => (
                                                <span key={tag} className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-700/50 text-slate-400">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>

                                        <h3 className="text-xl font-bold text-white mb-3 group-hover:text-violet-400 transition-colors">
                                            {doc.title}
                                        </h3>
                                        
                                        <p className="text-sm text-slate-400 leading-relaxed flex-grow">
                                            {doc.description}
                                        </p>

                                        <div className="mt-8 flex items-center text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-violet-400 transition-colors">
                                            Launch Document <Icon name="chevron-right" className="ml-2 w-4 h-4" />
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <footer className="mt-24 pt-12 border-t border-slate-800/60 flex flex-col md:flex-row justify-between items-center gap-6 text-slate-500 text-sm">
                                <div className="flex items-center gap-6">
                                    <span className="flex items-center gap-2">
                                        <Icon name="layout" className="w-4 h-4" /> v2.0-STABLE
                                    </span>
                                    <span className="flex items-center gap-2">
                                        <Icon name="info" className="w-4 h-4" /> Documentation Portal
                                    </span>
                                </div>
                                <div className="flex items-center gap-4">
                                    <a href="#" className="hover:text-white transition-colors">GitHub Repository</a>
                                    <div className="w-1 h-1 rounded-full bg-slate-700"></div>
                                    <span>© 2024 Finding Fern Project</span>
                                </div>
                            </footer>
                        </div>
                    ) : (
                        /* Fullscreen Document Viewer */
                        <div className="fixed inset-0 z-50 bg-[#0f172a] flex flex-col">
                            <nav className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <button 
                                        onClick={closeDoc}
                                        className="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-2"
                                    >
                                        <Icon name="arrow-left" className="w-5 h-5" />
                                        <span className="hidden sm:inline text-sm font-medium">Back to Portal</span>
                                    </button>
                                    <div className="h-6 w-[1px] bg-slate-800 mx-2"></div>
                                    <div className="flex items-center gap-3">
                                        <div className={`w-8 h-8 rounded-lg bg-gradient-to-br ${activeDoc.color} flex items-center justify-center text-white`}>
                                            <Icon name={activeDoc.icon} className="w-4 h-4" />
                                        </div>
                                        <h2 className="font-bold text-white text-sm sm:text-base">{activeDoc.title}</h2>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-2">
                                    <a 
                                        href={activeDoc.file} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-bold transition-all shadow-lg shadow-violet-900/20"
                                    >
                                        <span className="hidden sm:inline">Pop-out</span>
                                        <Icon name="external-link" className="w-4 h-4" />
                                    </a>
                                </div>
                            </nav>
                            
                            <div className="flex-grow bg-white">
                                <iframe 
                                    src={activeDoc.file} 
                                    className="w-full h-full border-none doc-iframe"
                                    title={activeDoc.title}
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
